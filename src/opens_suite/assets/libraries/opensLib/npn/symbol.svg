<svg xmlns="http://www.w3.org/2000/svg" width="80" height="60" viewBox="0 0 80 60">
  <defs>
    <style>
      .pin { fill: none; stroke: none; }
      .symbol { fill: none; stroke: black; stroke-width: 2; stroke-linecap: round; }
      .label { font-family: Arial; font-size: 8px; fill: blue; }
      .value { font-family: Arial; font-size: 8px; fill: black; }
    </style>
    <opens:param xmlns:opens="http://opens-schematic.org" name="MODEL" value="Q" />
    <opens:symbol xmlns:opens="http://opens-schematic.org" prefix="Q" bindkey="q" category="Transistors" />
    <opens:xyce xmlns:opens="http://opens-schematic.org" template="Q{name} {pin_c} {pin_b} {pin_e} {MODEL}" />
  </defs>
  <!-- NPN symbol: base line and connections -->
  <line class="symbol" x1="0" y1="30" x2="20" y2="30" />
  <line class="symbol" x1="20" y1="15" x2="20" y2="45" style="stroke-width: 3;" />
  
  <!-- Collector: vertical leg then diagonal -->
  <polyline class="symbol" points="40,0 40,15 20,25" />
  
  <!-- Emitter: vertical leg then diagonal with arrow -->
  <polyline class="symbol" points="40,60 40,45 20,35" />
  <!-- Arrow in the middle of the diagonal (30, 40) pointing towards (40, 45) -->
  <polygon fill="black" points="26,42 34,44 32,36" transform="rotate(25, 30, 40)" />

  <!-- Pins: collector top, base left, emitter bottom -->
  <circle class="pin" id="pin_c" cx="40" cy="0" r="2" />
  <circle class="pin" id="pin_b" cx="0" cy="30" r="2" />
  <circle class="pin" id="pin_e" cx="40" cy="60" r="2" />

  <text x="50" y="15" class="label">{name}</text>
  <text x="50" y="30" class="value">{MODEL}</text>
</svg>
